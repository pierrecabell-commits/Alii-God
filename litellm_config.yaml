model_list:
  # Primary local models via Ollama
  - model_name: dolphin-llama3
    litellm_params:
      model: ollama/dolphin-llama3:8b
      api_base: http://localhost:11434

  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  - model_name: qwen2.5
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://localhost:11434

  - model_name: neural-chat
    litellm_params:
      model: ollama/neural-chat:7b
      api_base: http://localhost:11434

  - model_name: dolphin-phi
    litellm_params:
      model: ollama/dolphin-phi:2.7b
      api_base: http://localhost:11434

  # Speed-optimized alias: fast → dolphin-phi:2.7b
  - model_name: fast
    litellm_params:
      model: ollama/dolphin-phi:2.7b
      api_base: http://localhost:11434

  # Smart reasoning alias: smart → qwen2.5:7b
  - model_name: smart
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://localhost:11434

  # Smart-Plus: mistral-nemo:12b — deeper reasoning, better than 7B
  # Pull: ollama pull mistral-nemo:12b
  - model_name: smart-plus
    litellm_params:
      model: ollama/mistral-nemo:12b
      api_base: http://localhost:11434

  # Code alias: code → qwen2.5-coder:7b
  - model_name: code
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  # Default model alias
  - model_name: default
    litellm_params:
      model: ollama/dolphin-llama3:8b
      api_base: http://localhost:11434

  # Jetson Nano GPU inference — edge node (CUDA 10.2, Maxwell GPU, ARM64)
  # Models stored at /data/ollama_models on Jetson
  - model_name: jetson
    litellm_params:
      model: ollama/tinyllama
      api_base: http://100.87.137.61:11434

  - model_name: jetson-tiny
    litellm_params:
      model: ollama/tinyllama
      api_base: http://100.87.137.61:11434

  # Cloud fallback — only active when ANTHROPIC_API_KEY is set
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Perplexity search
  - model_name: perplexity
    litellm_params:
      model: perplexity/sonar-pro
      api_key: os.environ/PERPLEXITY_API_KEY

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 90
  fallbacks:
    - fast:        [jetson-tiny, dolphin-phi, default]
    - smart:       [smart-plus, dolphin-llama3, default]
    - smart-plus:  [smart, dolphin-llama3, default]
    - code:        [dolphin-llama3, smart, default]
    - default:     [fast, dolphin-phi]
    - jetson:      [fast, dolphin-phi]
    - jetson-tiny: [fast, dolphin-phi]

litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: []
  failure_callback: []

cache:
  type: local
  ttl: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  disable_spend_logs: true
