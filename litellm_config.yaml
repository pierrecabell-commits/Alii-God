model_list:
  # Primary local models via Ollama
  - model_name: dolphin-llama3
    litellm_params:
      model: ollama/dolphin-llama3:8b
      api_base: http://localhost:11434

  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  - model_name: qwen2.5
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://localhost:11434

  - model_name: neural-chat
    litellm_params:
      model: ollama/neural-chat:7b
      api_base: http://localhost:11434

  - model_name: dolphin-phi
    litellm_params:
      model: ollama/dolphin-phi:2.7b
      api_base: http://localhost:11434

  # Default model alias - routes to primary local model
  - model_name: default
    litellm_params:
      model: ollama/dolphin-llama3:8b
      api_base: http://localhost:11434

  # Cloud fallback - uses env var only, only active when ANTHROPIC_API_KEY is set
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Perplexity search - uses env var only
  - model_name: perplexity
    litellm_params:
      model: perplexity/sonar-pro
      api_key: os.environ/PERPLEXITY_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60

litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  disable_spend_logs: true
